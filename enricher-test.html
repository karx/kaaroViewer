<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enricher Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #e6edf3;
      padding: 24px; min-height: 100vh;
    }
    h1 { font-size: 1.3rem; color: #58a6ff; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 24px; }

    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 24px; align-items: center;
    }
    input {
      background: #161b22; border: 1px solid #30363d;
      color: #e6edf3; padding: 8px 12px; border-radius: 6px;
      font-size: 0.9rem; flex: 1; min-width: 180px;
    }
    input::placeholder { color: #484f58; }
    input:focus { outline: none; border-color: #58a6ff; }

    label { font-size: 0.8rem; color: #8b949e; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    label input[type=checkbox] { accent-color: #58a6ff; }

    button {
      background: #238636; color: #fff;
      border: none; padding: 8px 18px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem;
      transition: background 0.15s;
    }
    button:hover  { background: #2ea043; }
    button:active { background: #1a7f37; }
    button.danger { background: #da3633; }
    button.danger:hover { background: #f85149; }

    #results {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }

    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; overflow: hidden;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid #21262d;
    }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; letter-spacing: .05em;
    }
    .badge-wikidata  { background: #1d4e89; color: #a8d4ff; }
    .badge-wikipedia { background: #2d4a3e; color: #7ee787; }
    .badge-youtube   { background: #5b1a1a; color: #ff7b72; }
    .badge-reddit    { background: #3d2b1a; color: #ffa657; }
    .badge-npm        { background: #2b1c10; color: #ff6b3d; }
    .badge-hackernews { background: #2b1a10; color: #ff9a3c; }
    .badge-PASS      { background: #0f2d1f; color: #3fb950; }
    .badge-FAIL      { background: #3d1114; color: #ff7b72; }
    .badge-SKIP      { background: #21262d; color: #8b949e; }

    .card-entity { font-size: 0.85rem; color: #e6edf3; font-weight: 600; }
    .card-time   { font-size: 0.75rem; color: #484f58; margin-left: auto; }

    .card-body { padding: 12px 16px; font-size: 0.8rem; }
    .card-body pre {
      background: #0d1117; border-radius: 6px; padding: 10px;
      overflow: auto; max-height: 280px; font-size: 0.75rem;
      color: #c9d1d9; line-height: 1.5; white-space: pre-wrap;
    }
    .summary-text {
      color: #8b949e; margin-bottom: 8px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .metric-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .metric-chip {
      background: #21262d; border-radius: 4px;
      padding: 2px 8px; font-size: 0.72rem; color: #8b949e;
    }
    .metric-chip span { color: #e6edf3; }
    .thumb {
      width: 100%; max-height: 120px; object-fit: cover;
      border-radius: 6px; margin-bottom: 8px;
    }
    .links-row a {
      color: #58a6ff; font-size: 0.75rem; margin-right: 8px;
      text-decoration: none;
    }
    .links-row a:hover { text-decoration: underline; }
    .error-text { color: #ff7b72; }

    #status-bar {
      font-size: 0.78rem; color: #8b949e;
      margin-bottom: 14px; min-height: 1.2em;
    }
    #status-bar .running { color: #f0883e; }

    .sep { border: none; border-top: 1px solid #21262d; margin: 16px 0; }
  </style>
</head>
<body>

<h1>⚗ Enricher Test Harness</h1>
<p class="subtitle">Phase 1 — Adapter Foundation · kaaroViewer Exploration Pipeline</p>

<div class="controls">
  <input id="entity-input" type="text" placeholder="Entity label, e.g. Git" value="Git">
  <input id="qid-input"    type="text" placeholder="Wikidata QID (optional), e.g. Q186055" value="Q186055">
  <input id="gh-input"     type="text" placeholder="GitHub slug (optional), e.g. git/git" value="git/git">
  <input id="sub-input"    type="text" placeholder="Subreddit (optional), e.g. git" value="git">
</div>
<div class="controls">
  <label><input type="checkbox" id="cb-wikidata"  checked> Wikidata</label>
  <label><input type="checkbox" id="cb-wikipedia" checked> Wikipedia</label>
  <label><input type="checkbox" id="cb-github"    checked> GitHub</label>
  <label><input type="checkbox" id="cb-reddit"    checked> Reddit</label>
  <label><input type="checkbox" id="cb-npm"       checked> npm</label>
  <label><input type="checkbox" id="cb-hackernews" checked> Hacker News</label>
  <label><input type="checkbox" id="cb-youtube"> YouTube (needs API key)</label>
  <button id="run-btn">▶ Run Tests</button>
  <button class="danger" id="clear-btn">✕ Clear</button>
</div>

<div id="status-bar">Ready.</div>
<div id="results"></div>

<!-- Fake minimal logger for the modules that import it -->
<script type="module">

// ── Minimal logger shim ──────────────────────────────────────────────────────
// enrichers/* import from '../logger.mjs' which uses window & DOM.
// We provide a minimal compatible export inline via an importmap override.

// We can't override ESM imports easily, so we'll dynamically re-implement
// the test by inlining a stub. Instead let's use dynamic import with a
// query-string cache-bust and patch window.kaaroLogs as a shim.

// Actually: logger.mjs references window.kaaroLogs and document.getElementById,
// which are fine in a browser context. It will just log to console.
// So we can import the adapters directly.

import { register, runAdapters, mergeResults, makeResult, nullResult } from './enrichers/index.mjs';
import * as wikidataAdapter  from './enrichers/wikidata.mjs';
import * as wikipediaAdapter from './enrichers/wikipedia.mjs';
import * as githubAdapter    from './enrichers/github.mjs';
import * as npmAdapter       from './enrichers/npm.mjs';
import * as hnAdapter        from './enrichers/hackernews.mjs';
import * as redditAdapter    from './enrichers/reddit.mjs';

// Register all available adapters
register('wikidata',   wikidataAdapter.enrich);
register('wikipedia',  wikipediaAdapter.enrich);
register('github',     githubAdapter.enrich);
register('npm',        npmAdapter.enrich);
register('hackernews', hnAdapter.enrich);
register('reddit',     redditAdapter.enrich);

// ── Test cases (hardcoded fixtures) ─────────────────────────────────────────

const TESTS = [
  {
    label: 'Git',
    ids:   { wikidata: 'Q186055', github: 'git/git', reddit: 'git', npm: null },
    adapters: ['wikidata', 'wikipedia', 'github', 'reddit', 'npm', 'hackernews'],
  },
  {
    label: 'Python (programming language)',
    ids:   { wikidata: 'Q28865', github: 'python/cpython', reddit: 'Python', npm: null },
    adapters: ['wikidata', 'wikipedia', 'github', 'reddit', 'npm', 'hackernews'],
  },
  {
    label: 'Linux',
    ids:   { wikidata: 'Q388', github: 'torvalds/linux', reddit: 'linux', npm: null },
    adapters: ['wikidata', 'wikipedia', 'github', 'reddit', 'npm', 'hackernews'],
  },
];

// Grace period for adapters that may fail gracefully
const KNOWN_SKIP_SOURCES = ['youtube']; // require API key

// ── UI helpers ───────────────────────────────────────────────────────────────

const resultsEl = document.getElementById('results');
const statusEl  = document.getElementById('status-bar');

function setStatus(msg, running = false) {
  statusEl.innerHTML = running
    ? `<span class="running">⟳ ${msg}</span>`
    : msg;
}

function badge(text, cls) {
  return `<span class="badge badge-${cls}">${text}</span>`;
}

function renderCard(source, entity, result, ms) {
  const isPass = result && !result.error;
  const isSkip = result?.error === 'no data' || result?.error?.includes('no API key');
  const status = isSkip ? 'SKIP' : isPass ? 'PASS' : 'FAIL';

  let body = '';

  if (isPass) {
    if (result.thumbnail) {
      body += `<img class="thumb" src="${result.thumbnail}" onerror="this.style.display='none'" alt="thumbnail">`;
    }
    if (result.summary) {
      body += `<p class="summary-text">${result.summary.slice(0, 300)}</p>`;
    }
    const metricEntries = Object.entries(result.metrics ?? {});
    if (metricEntries.length) {
      body += `<div class="metric-row">`;
      for (const [k, v] of metricEntries.slice(0, 8)) {
        body += `<div class="metric-chip">${k}: <span>${String(v).slice(0, 30)}</span></div>`;
      }
      body += `</div>`;
    }
    if (result.links?.length) {
      body += `<div class="links-row">`;
      for (const l of result.links.slice(0, 3)) {
        const short = l.replace(/^https?:\/\//, '').slice(0, 50);
        body += `<a href="${l}" target="_blank">↗ ${short}</a>`;
      }
      body += `</div>`;
    }
    if (result.related_ids?.length) {
      body += `<p style="color:#8b949e;font-size:0.72rem;margin-top:6px">related_ids: ${result.related_ids.slice(0,6).join(', ')}</p>`;
    }
  } else if (isSkip) {
    body += `<p class="summary-text">⊘ Skipped: ${result?.error ?? 'no data'}</p>`;
  } else {
    body += `<p class="error-text">✗ ${result?.error ?? 'null result'}</p>`;
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      ${badge(source.toUpperCase(), source)}
      <span class="card-entity">${entity}</span>
      ${badge(status, status)}
      <span class="card-time">${ms}ms</span>
    </div>
    <div class="card-body">${body}</div>
  `;
  resultsEl.appendChild(card);
}

// ── Main runner ──────────────────────────────────────────────────────────────

async function runCustomTest() {
  const entityLabel = document.getElementById('entity-input').value.trim() || 'Git';
  const qid    = document.getElementById('qid-input').value.trim() || null;
  const ghSlug = document.getElementById('gh-input').value.trim()  || null;
  const sub    = document.getElementById('sub-input').value.trim() || null;

  const activeAdapters = ['wikidata','wikipedia','github','reddit','npm','hackernews','youtube']
    .filter(s => document.getElementById(`cb-${s}`)?.checked);

  if (!activeAdapters.length) { setStatus('Select at least one adapter.'); return; }

  const idMap = {
    label: entityLabel,
    ids: {
      ...(qid    ? { wikidata: qid } : {}),
      ...(ghSlug ? { github: ghSlug } : {}),
      ...(sub    ? { reddit: sub } : {}),
    },
  };

  setStatus(`Running [${activeAdapters.join(', ')}] for "${entityLabel}"…`, true);

  for (const source of activeAdapters) {
    const adapterFn = { wikidata: wikidataAdapter.enrich, wikipedia: wikipediaAdapter.enrich,
                        github: githubAdapter.enrich,    reddit: redditAdapter.enrich,
                        npm: npmAdapter.enrich,          hackernews: hnAdapter.enrich }[source];
    if (!adapterFn) continue;

    const t0 = performance.now();
    try {
      const result = await adapterFn(entityLabel, idMap.ids[source] ?? null, idMap);
      const ms = Math.round(performance.now() - t0);
      renderCard(source, entityLabel, result, ms);
    } catch (err) {
      renderCard(source, entityLabel, { error: err.message }, Math.round(performance.now() - t0));
    }
  }

  setStatus(`Done — ${activeAdapters.length} adapters tested for "${entityLabel}".`);
}

async function runFixtureTests() {
  setStatus('Running fixture tests…', true);
  let passed = 0, failed = 0, skipped = 0;

  for (const tc of TESTS) {
    for (const source of tc.adapters) {
      const adapterFn = { wikidata: wikidataAdapter.enrich, wikipedia: wikipediaAdapter.enrich,
                          github: githubAdapter.enrich,    reddit: redditAdapter.enrich,
                          npm: npmAdapter.enrich,          hackernews: hnAdapter.enrich }[source];
      if (!adapterFn) continue;

      const t0 = performance.now();
      try {
        const result = await adapterFn(tc.label, tc.ids[source] ?? null, tc);
        const ms = Math.round(performance.now() - t0);
        const isSkip = result?.error === 'no data' || (result?.error ?? '').includes('no API key');
        if (!result || result.error) {
          if (isSkip) skipped++; else failed++;
        } else {
          passed++;
        }
        renderCard(source, tc.label, result, ms);
      } catch(err) {
        failed++;
        renderCard(source, tc.label, { error: err.message }, Math.round(performance.now() - t0));
      }
    }

    // Separator between fixture runs
    const sep = document.createElement('hr');
    sep.className = 'sep';
    sep.style.gridColumn = '1 / -1';
    resultsEl.appendChild(sep);
  }

  setStatus(`Fixture tests done — ✓ ${passed} passed · ✗ ${failed} failed · ⊘ ${skipped} skipped`);
}

// ── Wire buttons ─────────────────────────────────────────────────────────────

document.getElementById('run-btn').addEventListener('click', runCustomTest);
document.getElementById('clear-btn').addEventListener('click', () => {
  resultsEl.innerHTML = '';
  setStatus('Cleared.');
});

// Run fixture tests on page load so results are immediate
window.addEventListener('DOMContentLoaded', () => {});

// Expose fixture runner globally for console access
window.runFixtures = runFixtureTests;
window.runCustom   = runCustomTest;

setStatus('Ready — fill in fields and click ▶ Run Tests, or call <code>runFixtures()</code> in the console.');

</script>
</body>
</html>
