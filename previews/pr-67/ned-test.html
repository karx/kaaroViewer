<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NED++ Resolution Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #e6edf3;
      padding: 24px; min-height: 100vh;
    }
    h1 { font-size: 1.3rem; color: #81ecec; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 20px; }

    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 12px; align-items: center;
    }
    input, select {
      background: #161b22; border: 1px solid #30363d;
      color: #e6edf3; padding: 8px 12px; border-radius: 6px;
      font-size: 0.9rem;
    }
    input { flex: 1; min-width: 180px; }
    input::placeholder { color: #484f58; }
    input:focus, select:focus { outline: none; border-color: #81ecec; }

    button {
      background: #1d6e8a; color: #fff;
      border: none; padding: 8px 18px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem;
      transition: background 0.15s;
    }
    button:hover  { background: #2284a3; }
    button.danger { background: #da3633; }
    button.danger:hover { background: #f85149; }
    button.green  { background: #238636; }
    button.green:hover { background: #2ea043; }

    #status-bar {
      font-size: 0.78rem; color: #8b949e;
      margin-bottom: 14px; min-height: 1.4em;
    }
    #status-bar .running { color: #81ecec; }

    table {
      width: 100%; border-collapse: collapse;
      font-size: 0.82rem; margin-bottom: 20px;
    }
    th {
      background: #161b22; color: #8b949e;
      padding: 8px 12px; text-align: left;
      border-bottom: 1px solid #30363d; font-weight: 600;
    }
    td {
      padding: 8px 12px; border-bottom: 1px solid #21262d;
      vertical-align: top;
    }
    tr:hover td { background: #161b22; }

    .id-chip {
      display: inline-block;
      background: #21262d; border-radius: 4px;
      padding: 2px 7px; font-size: 0.72rem;
      margin: 2px; color: #e6edf3;
    }
    .id-chip.wikidata  { border-left: 3px solid #a29bfe; }
    .id-chip.youtube   { border-left: 3px solid #ff7b72; }
    .id-chip.reddit    { border-left: 3px solid #ffa657; }
    .id-chip.github    { border-left: 3px solid #d2a8ff; }

    .conf-bar {
      display: inline-block;
      background: #21262d; border-radius: 3px;
      height: 8px; width: 60px; position: relative;
      vertical-align: middle; margin-left: 6px;
    }
    .conf-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: #3fb950; border-radius: 3px;
    }
    .conf-fill.medium { background: #f0883e; }
    .conf-fill.low    { background: #ff7b72; }

    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; letter-spacing: .04em;
    }
    .badge-PASS  { background: #0f2d1f; color: #3fb950; }
    .badge-FAIL  { background: #3d1114; color: #ff7b72; }
    .badge-SKIP  { background: #21262d; color: #8b949e; }
    .badge-CACHE { background: #1d3557; color: #81ecec; }

    .sep { margin: 20px 0; border: none; border-top: 1px solid #21262d; }

    pre {
      background: #0d1117; border: 1px solid #21262d; border-radius: 6px;
      padding: 12px; font-size: 0.75rem; color: #c9d1d9;
      overflow: auto; max-height: 220px; line-height: 1.5;
    }
  </style>
</head>
<body>

<h1>⟐ NED++ Resolution Test</h1>
<p class="subtitle">Phase 2 — Multi-source entity resolution · kaaroViewer Exploration Pipeline</p>

<div class="controls">
  <input id="label-input" type="text" placeholder="Entity label, e.g. Git" value="Git">
  <select id="type-input">
    <option value="unknown">type: unknown</option>
    <option value="person">person</option>
    <option value="software" selected>software</option>
    <option value="company">company</option>
    <option value="channel">channel</option>
    <option value="subreddit">subreddit</option>
    <option value="tool">tool</option>
    <option value="framework">framework</option>
  </select>
  <input id="ctx-input" type="text" placeholder="Seed context (optional)" value="version control software">
  <button id="resolve-btn">⟐ Resolve</button>
  <button class="green" id="fixtures-btn">▶ Run Fixtures</button>
  <button class="danger" id="clear-btn">✕ Clear</button>
</div>
<div class="controls">
  <button id="cache-btn" style="background:#2d333b">📋 Show Cache</button>
  <button id="clrcache-btn" class="danger" style="font-size:0.78rem;padding:6px 12px">Clear NED Cache</button>
</div>

<div id="status-bar">Ready.</div>
<table id="results-table">
  <thead>
    <tr>
      <th>Entity</th><th>Type</th><th>Resolved IDs</th>
      <th>Confidence</th><th>Status</th><th>Time</th>
    </tr>
  </thead>
  <tbody id="results-body"></tbody>
</table>

<div id="cache-panel" style="display:none">
  <h3 style="font-size:0.85rem;color:#8b949e;margin-bottom:8px">NED Cache Contents</h3>
  <pre id="cache-pre"></pre>
</div>

<script type="module">
import { resolveEntity, resolveEntities, clearNEDCache, listNEDCache }
  from './pipeline/ned-resolver.mjs';

const tbody    = document.getElementById('results-body');
const statusEl = document.getElementById('status-bar');

function setStatus(msg, running = false) {
  statusEl.innerHTML = running
    ? `<span class="running">⟳ ${msg}</span>`
    : msg;
}

function confClass(c) {
  if (c >= 0.85) return '';
  if (c >= 0.65) return 'medium';
  return 'low';
}

function renderRow(label, type, result, ms, fromCache = false) {
  const ids = result?.ids ?? {};
  const conf = result?.confidence ?? {};

  const hasAny = Object.keys(ids).length > 0;
  const status = fromCache ? 'CACHE' : hasAny ? 'PASS' : 'FAIL';

  const idChips = Object.entries(ids).map(([src, id]) =>
    `<span class="id-chip ${src}" title="${src}: ${id}">${src}: ${String(id).slice(0, 28)}</span>`
  ).join('');

  const confChips = Object.entries(conf).map(([src, c]) =>
    `<span style="font-size:0.72rem;color:#8b949e">${src} ${(c * 100).toFixed(0)}%</span>
     <span class="conf-bar"><span class="conf-fill ${confClass(c)}" style="width:${(c*60).toFixed(0)}px"></span></span> `
  ).join('');

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><strong>${label}</strong></td>
    <td style="color:#8b949e">${type}</td>
    <td>${idChips || '<span style="color:#484f58">—</span>'}</td>
    <td>${confChips || '—'}</td>
    <td><span class="badge badge-${status}">${status}</span></td>
    <td style="color:#484f58">${ms}ms</td>
  `;
  tbody.appendChild(tr);
}

// ── Fixture test cases ────────────────────────────────────────────────────────

const FIXTURES = [
  { label: 'Git',              type: 'software',   expect: { wikidata: 'Q186055' } },
  { label: 'Python',           type: 'software',   expect: { wikidata: 'Q28865'  } },
  { label: 'Linux',            type: 'software',   expect: { wikidata: 'Q388'    } },
  { label: 'JavaScript',       type: 'software',   expect: { wikidata: 'Q2005'   } },
  { label: 'r/programming',    type: 'subreddit',  expect: { reddit: 'programming' } },
  { label: 'torvalds/linux',   type: 'software',   expect: { github: 'torvalds/linux' } },
];

async function runFixtures() {
  setStatus('Running fixture tests…', true);
  let pass = 0, fail = 0;

  for (const fx of FIXTURES) {
    const t0  = performance.now();
    try {
      const result = await resolveEntity({ label: fx.label, type: fx.type });
      const ms = Math.round(performance.now() - t0);

      // Validate expectations
      let ok = true;
      for (const [src, expectedId] of Object.entries(fx.expect)) {
        if (result.ids[src] !== expectedId) { ok = false; break; }
      }
      ok ? pass++ : fail++;
      renderRow(fx.label, fx.type, result, ms, false);
    } catch (err) {
      fail++;
      renderRow(fx.label, fx.type, null, Math.round(performance.now() - t0));
    }
  }
  setStatus(`Fixtures done — ✓ ${pass} passed · ✗ ${fail} failed`);
}

// ── Custom resolve ────────────────────────────────────────────────────────────

async function runCustom() {
  const label = document.getElementById('label-input').value.trim();
  const type  = document.getElementById('type-input').value;
  const ctx   = document.getElementById('ctx-input').value.trim();
  if (!label) { setStatus('Enter an entity label.'); return; }

  setStatus(`Resolving "${label}" (${type})…`, true);
  const t0 = performance.now();
  try {
    const result = await resolveEntity({ label, type, seedContext: ctx });
    const ms = Math.round(performance.now() - t0);
    renderRow(label, type, result, ms, false);
    setStatus(`Done — "${label}" resolved in ${ms}ms.`);
  } catch (err) {
    setStatus(`Error: ${err.message}`);
  }
}

// ── Wire buttons ──────────────────────────────────────────────────────────────

document.getElementById('resolve-btn').addEventListener('click', runCustom);
document.getElementById('fixtures-btn').addEventListener('click', runFixtures);
document.getElementById('clear-btn').addEventListener('click', () => {
  tbody.innerHTML = ''; setStatus('Cleared.');
});
document.getElementById('cache-btn').addEventListener('click', () => {
  const panel = document.getElementById('cache-panel');
  const pre   = document.getElementById('cache-pre');
  const entries = listNEDCache();
  pre.textContent = JSON.stringify(entries, null, 2);
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('clrcache-btn').addEventListener('click', () => {
  const n = clearNEDCache(); setStatus(`NED cache cleared — ${n} entries removed.`);
});

// Expose globally
window.nedResolve  = (label, type) => resolveEntity({ label, type }).then(r => { console.table(r.ids); return r; });
window.runFixtures = runFixtures;

setStatus('Ready — fill in a label and click ⟐ Resolve, or click ▶ Run Fixtures.');
</script>
</body>
</html>
