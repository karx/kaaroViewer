<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kaaroViewer</title>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">

    <!-- ── Breadcrumb ─────────────────────────────────────────────────── -->
    <div class="top-bar">
      <div id="breadcrumb" class="breadcrumb">
        <span class="bc-empty">explore something…</span>
      </div>
      <div class="log-toggle" id="log-toggle" title="Toggle debug log">◎</div>
    </div>

    <!-- ── Middle: canvas + detail panel ─────────────────────────────── -->
    <div class="middle">
      <div class="canvas-wrap" id="theScene"></div>

      <!-- Detail panel -->
      <div class="detail-panel" id="detail-panel"></div>
    </div>

    <!-- ── Command bar ───────────────────────────────────────────────── -->
    <div class="input-bar">
      <span class="cmd-prompt">&gt;</span>
      <input
        id="main-input"
        type="text"
        placeholder="ENTITY / QID / lp:player / yt:video / r/sub query"
        autocomplete="off"
        spellcheck="false"
      >
      <div id="source-toggles" class="source-toggles"></div>
      <button id="voice-btn" title="Start voice">F1 MIC</button>
      <button id="save-btn"  title="Save session">F2 SAVE</button>
      <button id="sessions-btn" title="Saved sessions">F8 SSNS</button>
      <button id="library-btn"  title="Load local document">F5 LIB</button>
    </div>

    <!-- ── Function key hints ────────────────────────────────────────── -->
    <div class="fnkey-bar">
      <span class="fnk"><em>F1</em> VOICE</span>
      <span class="fnk"><em>F2</em> SAVE</span>
      <span class="fnk"><em>F3</em> EXPAND</span>
      <span class="fnk"><em>F4</em> CLEAR</span>
      <span class="fnk"><em>DBL-CLICK</em> EXPAND NODE</span>
      <span class="fnk"><em>CLICK</em> DETAIL</span>
      <span class="fnk"><em>F5</em> LIBRARY</span>
      <span class="fnk"><em>F8</em> SESSIONS</span>
      <span class="fnk fnk-right"><em>◎</em> LOG</span>
    </div>

  </div>

  <!-- ── Library drawer ──────────────────────────────────────────────── -->
  <div id="library-wrap" class="library-wrap">
    <div class="library-header">
      <span>◆ LOCAL LIBRARY</span>
      <button id="library-close">✕</button>
    </div>
    <div id="library-drawer" class="library-drawer"></div>
  </div>

  <!-- ── Sessions drawer (overlay) ───────────────────────────────────── -->
  <div id="sessions-wrap" class="sessions-wrap">
    <div class="sessions-header">
      <span>Saved Explorations</span>
      <button id="sessions-close">✕</button>
    </div>
    <div id="sessions-drawer" class="sessions-drawer"></div>
  </div>

  <!-- ── Debug log (hidden by default) ───────────────────────────────── -->
  <div id="log-bar" class="log-bar hidden">
    <div id="logger" class="log-inner"></div>
  </div>

  <script type="module" src="./main.mjs"></script>
  <script>
    // Sessions close button (non-module)
    document.getElementById('sessions-close')?.addEventListener('click', () => {
      document.getElementById('sessions-wrap')?.classList.remove('open');
    });
    // Log toggle
    document.getElementById('log-toggle')?.addEventListener('click', () => {
      document.getElementById('log-bar')?.classList.toggle('hidden');
    });
  </script>
</body>
</html>
