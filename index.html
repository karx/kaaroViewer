<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kaaroViewer — Knowledge Graph Explorer</title>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">

    <!-- ── Top bar: breadcrumb ─────────────────────────────────────────── -->
    <div class="top-bar" role="banner">
      <nav id="breadcrumb" class="breadcrumb" role="navigation" aria-label="Exploration history" aria-live="polite">
        <span class="bc-empty" aria-label="No entity selected — explore something">explore something…</span>
      </nav>
      <button class="log-toggle" id="log-toggle" aria-label="Toggle debug log" aria-expanded="false" aria-controls="log-bar">◎</button>
    </div>

    <!-- ── Middle: canvas + report + detail panel ────────────────────── -->
    <main class="middle" id="main-content">

      <div class="canvas-wrap" id="theScene" role="application" aria-label="3D knowledge graph canvas — use mouse to navigate, click nodes to inspect">
        <!-- Cluster isolation pills overlay (C-03 / IA-06) -->
        <div id="cluster-pills" class="cluster-pills hidden" role="toolbar" aria-label="Cluster isolation — press 1–6 or click to isolate a cluster"></div>
        <!-- Sentiment / tier overlay toggle buttons (C-06) -->
        <div class="canvas-overlays" role="group" aria-label="Visual overlay modes">
          <button id="overlay-sent-btn" class="overlay-btn" aria-label="Toggle sentiment colour mode (S key)" aria-pressed="false" title="S — Sentiment colour mode">SENT</button>
          <button id="overlay-tier-btn" class="overlay-btn" aria-label="Toggle tier size mode (T key)" aria-pressed="false" title="T — Tier size mode">TIER</button>
        </div>
        <!-- Key stats strip (C-12) -->
        <div id="stats-strip" class="stats-strip hidden" role="status" aria-label="Document key statistics" aria-live="polite"></div>
      </div>

      <!-- Report view (F9) -->
      <div id="report-wrap" class="report-wrap" role="complementary" aria-label="Intelligence brief report">
        <div id="report-inner" class="report-inner" tabindex="-1"></div>
      </div>

      <!-- Detail panel -->
      <aside class="detail-panel" id="detail-panel" role="complementary" aria-label="Entity detail panel" aria-live="polite"></aside>

    </main>

    <!-- ── Command bar ───────────────────────────────────────────────── -->
    <div class="input-bar" role="search">
      <label for="main-input" class="cmd-prompt" aria-label="Entity search prompt">›</label>
      <input
        id="main-input"
        type="search"
        placeholder="entity name, QID, lp:player, yt:video, r/subreddit"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search for an entity or enter a query"
        enterkeyhint="search"
      >
      <div id="source-toggles" class="source-toggles" role="group" aria-label="Data sources"></div>
      <button id="voice-btn" aria-label="Toggle voice input (F1)" title="Start voice">F1 MIC</button>
      <button id="save-btn"  aria-label="Save current session (F2)" title="Save session">F2 SAVE</button>
      <button id="sessions-btn" aria-label="Open saved sessions (F8)" title="Saved sessions">F8 SSNS</button>
      <button id="library-btn"  aria-label="Open local document library (F5)" title="Load local document" aria-haspopup="dialog">F5 LIB</button>
      <button id="report-btn"   aria-label="Toggle intelligence report (F9)" title="Toggle report view" aria-expanded="false">F9 RPT</button>
    </div>

    <!-- ── Function key hints ────────────────────────────────────────── -->
    <div class="fnkey-bar" id="fnkey-bar" role="status" aria-label="Available keyboard shortcuts" aria-live="polite">
      <span class="fnk"><em>F1</em> VOICE</span>
      <span class="fnk"><em>F2</em> SAVE</span>
      <span class="fnk"><em>F3</em> EXPAND</span>
      <span class="fnk"><em>F4</em> CLEAR</span>
      <span class="fnk"><em>DBL-CLICK</em> EXPAND NODE</span>
      <span class="fnk"><em>CLICK</em> DETAIL</span>
      <span class="fnk"><em>F5</em> LIBRARY</span>
      <span class="fnk"><em>F8</em> SESSIONS</span>
      <span class="fnk fnk-right"><em>◎</em> LOG</span>
    </div>

  </div>

  <!-- ── Library drawer ──────────────────────────────────────────────── -->
  <div id="library-wrap" class="library-wrap" role="dialog" aria-modal="true" aria-label="Local document library" aria-hidden="true">
    <div class="library-header">
      <span id="library-title">◆ LOCAL LIBRARY</span>
      <button id="library-close" aria-label="Close library">✕</button>
    </div>
    <div id="library-drawer" class="library-drawer" role="list" aria-labelledby="library-title"></div>
  </div>

  <!-- ── Sessions drawer (overlay) ───────────────────────────────────── -->
  <div id="sessions-wrap" class="sessions-wrap" role="dialog" aria-modal="true" aria-label="Saved exploration sessions" aria-hidden="true">
    <div class="sessions-header">
      <span id="sessions-title">Saved Explorations</span>
      <button id="sessions-close" aria-label="Close sessions panel">✕</button>
    </div>
    <div id="sessions-drawer" class="sessions-drawer" role="list" aria-labelledby="sessions-title"></div>
  </div>

  <!-- ── Debug log (hidden by default) ───────────────────────────────── -->
  <div id="log-bar" class="log-bar hidden" role="log" aria-label="Debug log" aria-live="off">
    <div id="logger" class="log-inner"></div>
  </div>

  <script type="module" src="./main.mjs"></script>
  <script>
    // Sessions close button
    document.getElementById('sessions-close')?.addEventListener('click', () => {
      const wrap = document.getElementById('sessions-wrap');
      wrap?.classList.remove('open');
      wrap?.setAttribute('aria-hidden', 'true');
    });
    // Log toggle
    document.getElementById('log-toggle')?.addEventListener('click', function() {
      const bar  = document.getElementById('log-bar');
      const open = bar?.classList.toggle('hidden') === false;
      this.setAttribute('aria-expanded', String(!open));
    });
    // Sync aria-hidden on drawers
    const _libWrap  = document.getElementById('library-wrap');
    const _sessWrap = document.getElementById('sessions-wrap');
    new MutationObserver(ms => ms.forEach(m => {
      if (m.type === 'attributes' && m.attributeName === 'class') {
        const el   = m.target;
        const open = el.classList.contains('open');
        el.setAttribute('aria-hidden', String(!open));
        if (open) el.querySelector('button, [tabindex]')?.focus();
      }
    })).observe(_libWrap,  { attributes: true });
    new MutationObserver(ms => ms.forEach(m => {
      if (m.type === 'attributes' && m.attributeName === 'class') {
        const el   = m.target;
        const open = el.classList.contains('open');
        el.setAttribute('aria-hidden', String(!open));
      }
    })).observe(_sessWrap, { attributes: true });
  </script>
</body>
</html>
